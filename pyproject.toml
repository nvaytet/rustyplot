[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rustyplot"
version = "0.1.0"
description = "GPU-accelerated plotting for Python, with a Rust core"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = ["anywidget>=0.9", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["python/rustyplot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
