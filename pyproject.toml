[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rustyplot"
dynamic = ["version"]
description = "GPU-accelerated plotting for Python, with a Rust core"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = ["anywidget>=0.9", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest"]

# The git tag is the single source of truth for the version: releasing means
# tagging `v26.9.0`, not editing a number here.
[tool.hatch.version]
source = "vcs"

# build.sh generates these and .gitignore lists them, so hatchling's VCS-aware
# file selection would otherwise leave them out and ship a package that imports
# but cannot render.
[tool.hatch.build]
artifacts = [
  "python/rustyplot/static/rustyplot_wasm.js",
  "python/rustyplot/static/rustyplot_wasm_bg.wasm",
]

[tool.hatch.build.targets.wheel]
packages = ["python/rustyplot"]

[tool.hatch.build.targets.sdist]
include = ["python/rustyplot", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
