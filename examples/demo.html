<!doctype html>
<!-- Standalone browser check: exercises the same load path as the notebook widget,
     without needing Jupyter. Serve the repository root over HTTP and open this file. -->
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>loading</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 16px;
            background: #fafafa;
        }

        #status {
            margin-bottom: 8px;
            font-size: 14px;
        }

        canvas {
            border: 1px solid #ccc;
            background: #fff;
        }
    </style>
</head>

<body>
    <div id="status">loading…</div>
    <canvas id="plot" width="800" height="560"></canvas>

    <script type="module">
        const STATIC = "../python/rustyplot/static";
        const status = document.getElementById("status");
        const canvas = document.getElementById("plot");

        const fail = (message) => {
            status.textContent = `FAILED: ${message}`;
            document.title = `failed: ${message}`;
            console.error(message);
        };

        // Probe on a throwaway canvas: binding the real one to a context is permanent.
        const detectBackend = async () => {
            if (navigator.gpu) {
                try {
                    if (await navigator.gpu.requestAdapter()) {
                        return { useWebgpu: true, name: "WebGPU" };
                    }
                } catch (err) {
                    console.warn("WebGPU probe failed", err);
                }
            }
            const probe = document.createElement("canvas");
            if (probe.getContext("webgl2")) return { useWebgpu: false, name: "WebGL2" };
            return null;
        };

        try {
            const backend = await detectBackend();
            if (!backend) throw new Error("neither WebGPU nor WebGL2 is available");

            // Same blob-import trick the widget uses, so this page validates that path too.
            const source = await(await fetch(`${STATIC}/rustyplot_wasm.js`)).text();
            const url = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
            const wasm = await import(url);
            URL.revokeObjectURL(url);

            const bytes = await(await fetch(`${STATIC}/rustyplot_wasm_bg.wasm`)).arrayBuffer();
            await wasm.default({ module_or_path: bytes });

            const plot = await wasm.Plot.attach(canvas, backend.useWebgpu);

            const n = Number(new URLSearchParams(location.search).get("n") ?? 200000);
            const x = new Float32Array(n);
            const y = new Float32Array(n);
            const size = new Float32Array(n);
            const color = new Float32Array(4 * n);

            let seed = 12345;
            const rand = () => {
                seed = (seed * 1103515245 + 12345) & 0x7fffffff;
                return seed / 0x7fffffff;
            };

            for (let i = 0; i < n; i++) {
                const u = (rand() + rand() + rand() + rand()) / 4;
                const v = (rand() + rand() + rand() + rand()) / 4;
                x[i] = (u - 0.5) * 4;
                y[i] = (v - 0.5) * 4 + 0.6 * x[i];
                size[i] = 3 + 5 * rand();
                color[4 * i] = 0.15 + 0.5 * u;
                color[4 * i + 1] = 0.35;
                color[4 * i + 2] = 0.85 - 0.4 * v;
                color[4 * i + 3] = 0.55;
            }

            plot.set_background(1, 1, 1, 1);
            plot.set_scatter(x, y, size, color);
            plot.autoscale();

            const t0 = performance.now();
            plot.draw();
            const elapsed = (performance.now() - t0).toFixed(1);

            // Time a burst of frames the way a pan gesture would.
            const frames = 30;
            const t1 = performance.now();
            for (let i = 0; i < frames; i++) {
                plot.wheel(400, 280, i % 2 === 0 ? -20 : 20);
                plot.draw();
            }
            const perFrame = ((performance.now() - t1) / frames).toFixed(2);

            const message = `${plot.point_count()} points, first draw ${elapsed} ms, ${perFrame} ms/frame`;
            status.textContent = `OK (${backend.name}) — ${message}`;
            document.title = `ok: ${message}`;

            canvas.addEventListener("wheel", (e) => {
                e.preventDefault();
                plot.wheel(e.offsetX, e.offsetY, e.deltaY);
                plot.draw();
            }, { passive: false });
            canvas.addEventListener("pointerdown", (e) => plot.pointer_down(e.offsetX, e.offsetY));
            canvas.addEventListener("pointermove", (e) => {
                if (plot.pointer_move(e.offsetX, e.offsetY)) plot.draw();
            });
            canvas.addEventListener("pointerup", () => plot.pointer_up());
        } catch (err) {
            fail(String(err));
        }
    </script>
</body>

</html>
